server:
  port: 8080

spring:
  application:
    name: cjr-help-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cjr_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

cjr:
  wechat:
    # 微信开放平台扫码登录配置(留空则提示未配置; 需开放平台账号 https://open.weixin.qq.com)
    appid: ""
    secret: ""
  jwt:
    # JWT 签名密钥(HS256 要求至少 32 字符)
    secret: cjr-help-platform-jwt-secret-key-2026-production
    expire-hours: 72
  upload:
    # 图片上传目录(相对后端运行目录)
    dir: ./uploads

logging:
  level:
    com.cjr.platform: info
